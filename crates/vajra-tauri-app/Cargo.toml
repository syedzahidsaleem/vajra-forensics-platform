[package]
name = "vajra-tauri-app"
version = "0.1.0"
description = "Vajra Digital Forensics Platform Desktop App"
authors = ["Vajra Project Team"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.8"
lazy_static = "1.5"
hex = "0.4"
sha2 = "0.10"

vajra-core = { path = "../vajra-core" }
vajra-device = { path = "../vajra-device" }
vajra-case-db = { path = "../vajra-case-db" }
vajra-audit = { path = "../vajra-audit" }
vajra-custody = { path = "../vajra-custody" }
vajra-acquire = { path = "../vajra-acquire" }
vajra-image = { path = "../vajra-image" }
vajra-erase = { path = "../vajra-erase" }
vajra-file-erase = { path = "../vajra-file-erase" }
vajra-verify = { path = "../vajra-verify" }
