[package]
name = "vajra-device"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ATA/NVMe/SCSI raw I/O, OS device enumeration, and write-blocker detection for Vajra (§23–§24)"

[dependencies]
vajra-core = { path = "../vajra-core" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "ioctl", "uio"] }
